<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BetAlgo Pro Tracker</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <style>
        :root {
            --bg: #0f172a;
            --accent: #10b981;
            --error: #ef4444;
            --glass: rgba(30, 41, 59, 0.7);
            --text: #f1f5f9;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: radial-gradient(circle at bottom left, #1e293b, #0f172a);
            color: var(--text);
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
            -webkit-user-select: none;
        }

        .container {
            width: 100%; max-width: 450px; padding: 20px; box-sizing: border-box;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        .header-stats {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
        }

        .stat-box { text-align: center; }
        .stat-label { font-size: 10px; text-transform: uppercase; color: #94a3b8; letter-spacing: 1px; margin-bottom: 5px; }
        .stat-value { font-size: 22px; font-weight: 800; color: var(--accent); }

        .input-group { margin-top: 15px; }
        label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; }
        input {
            width: 100%; background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 14px; color: white;
            font-size: 16px; outline: none; box-sizing: border-box;
            transition: 0.3s;
        }
        input:focus { border-color: var(--accent); background: rgba(15, 23, 42, 1); }

        .main-calc { text-align: center; padding: 25px 0; border: 2px dashed rgba(255,255,255,0.05); margin: 20px 0; border-radius: 24px; }
        .suggested-bet { font-size: 54px; font-weight: 900; color: #fff; margin: 10px 0; letter-spacing: -2px; }
        
        .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        button {
            padding: 18px; border: none; border-radius: 16px; font-weight: 800;
            font-size: 15px; cursor: pointer; transition: transform 0.1s, opacity 0.2s;
            text-transform: uppercase;
        }
        button:active { transform: scale(0.96); }
        
        .btn-win { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
        .btn-lose { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
        .btn-reset { 
            background: transparent; border: 1px solid rgba(255,255,255,0.1); 
            color: #64748b; width: 100%; margin-top: 25px; padding: 12px; font-size: 12px;
        }

        .history-msg { font-size: 13px; color: #94a3b8; margin-top: 15px; text-align: center; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <div style="text-align: center; margin-bottom: 25px;">
        <h2 style="margin:0; font-weight: 800; letter-spacing: -1px;">PROGRESIVNI <span style="color:var(--accent)">BET</span></h2>
        <span style="font-size: 10px; color: #64748b; text-transform: uppercase;">Sistem za oporavak banke</span>
    </div>

    <div class="glass-card header-stats">
        <div class="stat-box">
            <div class="stat-label">Trenutno u banci</div>
            <div id="displayBanka" class="stat-value">0.00</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Akumuliran minus</div>
            <div id="displayMinus" class="stat-value" style="color: var(--error)">0.00</div>
        </div>
    </div>

    <div class="glass-card">
        <div class="input-group">
            <label>Početni kapital</label>
            <input type="number" id="initBanka" placeholder="1000" oninput="setup()">
        </div>
        <div class="input-group">
            <label>Ciljani profit po betu</label>
            <input type="number" id="initProfit" placeholder="100" oninput="calculate()">
        </div>
        <div class="input-group">
            <label>Sledeća kvota</label>
            <input type="number" id="trenutnaKvota" value="2.00" step="0.01" oninput="calculate()">
        </div>
    </div>

    <div class="main-calc">
        <div class="stat-label">Preporučen sledeći ulog</div>
        <div id="nextBet" class="suggested-bet">0.00</div>
    </div>

    <div class="action-btns">
        <button class="btn-win" onclick="handleResult(true)">Dobitak</button>
        <button class="btn-lose" onclick="handleResult(false)">Gubitak</button>
    </div>

    <div id="log" class="history-msg">Spreman za početak.</div>
    <button class="btn-reset" onclick="resetAll()">Resetuj sve podatke</button>
</div>

<script>
    let banka = 0;
    let minus = 0;
    let profitPoBetu = 0;

    function setup() {
        banka = parseFloat(document.getElementById('initBanka').value) || 0;
        updateUI();
        calculate();
    }

    function calculate() {
        profitPoBetu = parseFloat(document.getElementById('initProfit').value) || 0;
        const kvota = parseFloat(document.getElementById('trenutnaKvota').value) || 1.01;
        
        if (kvota <= 1) {
            document.getElementById('nextBet').innerText = "0.00";
            return;
        }

        // Formula za progresiju: (Dug + Cilj) / (Kvota - 1)
        const ulog = (minus + profitPoBetu) / (kvota - 1);
        document.getElementById('nextBet').innerText = ulog > 0 ? ulog.toFixed(2) : "0.00";
    }

    function handleResult(isWin) {
        const ulog = parseFloat(document.getElementById('nextBet').innerText);
        const kvota = parseFloat(document.getElementById('trenutnaKvota').value);
        
        if (ulog <= 0 || isNaN(ulog)) return;

        if (isWin) {
            banka += (ulog * (kvota - 1));
            minus = 0;
            document.getElementById('log').innerText = "✅ Profit ostvaren, minus je obrisan!";
            document.getElementById('log').style.color = "var(--accent)";
        } else {
            banka -= ulog;
            minus += ulog;
            document.getElementById('log').innerText = "❌ Gubitak! Sistem proračunava oporavak...";
            document.getElementById('log').style.color = "var(--error)";
        }
        
        updateUI();
        calculate();
    }

    function updateUI() {
        document.getElementById('displayBanka').innerText = banka.toLocaleString(undefined, {minimumFractionDigits: 2});
        document.getElementById('displayMinus').innerText = minus.toLocaleString(undefined, {minimumFractionDigits: 2});
    }

    function resetAll() {
        if(confirm("Pažnja: Ovo će resetovati tvoju banku i minus na nulu. Nastaviti?")) {
            minus = 0;
            document.getElementById('initBanka').value = "";
            document.getElementById('initProfit').value = "";
            setup();
        }
    }

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }
</script>
</body>
</html>
